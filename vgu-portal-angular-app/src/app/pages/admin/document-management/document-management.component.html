<div class="p-4 mx-auto">
    <div class="flex justify-between">
        <h2 class="text-xl font-semibold py-2">Report management</h2>
        <hr />
    </div>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>No.</th>
            <td mat-cell *matCellDef="let element">{{ element.id }}</td>
        </ng-container>

        <ng-container matColumnDef="code">
            <th mat-header-cell *matHeaderCellDef>Major</th>
            <td mat-cell *matCellDef="let element">{{ element.code }}</td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Student</th>
            <td mat-cell *matCellDef="let element" (click)="goToDetailClass(element)" class="text-blue-500 cursor-pointer hover:underline">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Note</th>
            <td mat-cell *matCellDef="let element">{{ element.status }}</td>
        </ng-container>

        <ng-container matColumnDef="start_date">
            <th mat-header-cell *matHeaderCellDef>Submit Time</th>
            <td mat-cell *matCellDef="let element">{{ moment(element.start_date).format('DD/MM/YYYY HH:mm') }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
            <th mat-header-cell *matHeaderCellDef>Action</th>
            <td mat-cell *matCellDef="let element">
                <button mat-icon-button class="text-lg" (click)="goToDocumentClass(element)">
                    <mat-icon>description</mat-icon>
                </button>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
    <mat-paginator
            [length]="total()"
            [pageIndex]="page()"
            [pageSize]="pageSize()"
            [pageSizeOptions]="[5, 10, 20]"
            showFirstLastButtons
            (page)="handleChangePage($event)"
            aria-label="Select page of periodic elements"
    >
    </mat-paginator>
</div>
