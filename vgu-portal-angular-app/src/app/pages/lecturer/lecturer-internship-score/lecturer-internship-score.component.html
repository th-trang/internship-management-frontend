<div class="p-4 mx-auto" [formGroup]="VForm">
  <div class="flex justify-between">
    <h2 class="text-xl font-semibold py-2">CLASS | Internship management</h2>
  </div>
  <!--      <div class="border-b border-black h-[1px] mb-4"></div>-->
  <div class="flex space-x-4 items-center filter-block">
    <input matInput type="text" [(ngModel)]="major" placeholder="Major" />
    <input matInput [(ngModel)]="company" placeholder="Company" />
    <button mat-icon-button color="primary" class="mb-4">
      <mat-icon class="h-20">search</mat-icon>
    </button>
  </div>
  <div class="flex justify-end w-full">
    <button mat-raised-button color="primary" class="mb-4" (click)="submitScore()">Submit</button>
  </div>
  <table
    mat-table
    [dataSource]="students"
    class="mat-elevation-z8"
    formArrayName="students"
  >
    <!-- (scroll)="onTableScroll($event)" -->
    <!--- Note that these columns can be defined in any order.
                  The actual rendered columns are set as a property on the row definition" -->

    <ng-container matColumnDef="no">
      <th mat-header-cell *matHeaderCellDef>No.</th>
      <td mat-cell *matCellDef="let element">{{ classInfo?.id }}</td>
    </ng-container>

    <ng-container matColumnDef="major">
      <th mat-header-cell *matHeaderCellDef>Major</th>
      <td mat-cell *matCellDef="let element">{{ classInfo?.major?.name }}</td>
    </ng-container>

    <ng-container matColumnDef="course">
      <th mat-header-cell *matHeaderCellDef>Course</th>
      <td
        mat-cell
        *matCellDef="let element"
        class="text-blue-500 cursor-pointer hover:underline"
      >
        {{ classInfo?.name }}
      </td>
    </ng-container>

    <ng-container matColumnDef="student">
      <th mat-header-cell *matHeaderCellDef>Student</th>
      <td mat-cell *matCellDef="let element">{{ element?.name }}</td>
    </ng-container>

    <ng-container matColumnDef="score">
      <th mat-header-cell *matHeaderCellDef>Score</th>
      <td mat-cell *matCellDef="let element; let i = index" [formGroupName]="i">
        <mat-form-field class="w-1/2">
          <input matInput type="text" formControlName="score" required />
        </mat-form-field>
      </td>
    </ng-container>

    <ng-container matColumnDef="comment">
        <th mat-header-cell *matHeaderCellDef>Commnet</th>
      <td mat-cell *matCellDef="let element; let i = index" [formGroupName]="i">
        <mat-form-field class="w-full">
          <input matInput type="text" formControlName="comment" required />
        </mat-form-field>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
