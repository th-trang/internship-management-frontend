<div style="padding-top: 10px;">
  <div class="drop-zone">
    @if ((isReady$ | async) || (hasFailed$ | async)) {
      <div class="text-wrapper">
        <div class="centered">
          <mat-icon class="material-icons-outlined">cloud_upload</mat-icon>
          <input type="file" name="file" id="file" (change)="uploadFile($event)" />
          <label for="file" class="text-sm">
            <span class="text-link text-sm">Click here to upload</span>
            or drag and drop
          </label>
        </div>
      </div>
    }
  </div>
</div>
@if (isInProgress$ | async) {
  <mat-progress-bar mode="determinate" class="mt-10">
    Uploading... {{progress$ | async}}%
  </mat-progress-bar>
}
@if (isInProgress$ |async) {
  <button mat-raised-button color="warn" (click)="cancelUpload()">Cancel</button>
}
@if (completed$ | async) {
  <h5>File has been uploaded successfully</h5>
}
@if (hasFailed$ | async) {
  <p>Error: {{error$ | async}}</p>
}
