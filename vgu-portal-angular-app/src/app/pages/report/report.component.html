<mat-drawer-container class="min-h-screen">
    <mat-drawer-content>
        <div class="p-4 mx-auto">
            <h2 class="text-xl font-semibold py-2">Internship report</h2>
            <div class="border-b border-black h-[1px] mb-4"></div>
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
                <!--- Note that these columns can be defined in any order.
                          The actual rendered columns are set as a property on the row definition" -->

                <ng-container matColumnDef="id">
                    <th mat-header-cell *matHeaderCellDef>No.</th>
                    <td mat-cell *matCellDef="let element">{{ element.id }}</td>
                </ng-container>

                <ng-container matColumnDef="major">
                    <th mat-header-cell *matHeaderCellDef>Major</th>
                    <td mat-cell *matCellDef="let element">{{ element.major }}</td>
                </ng-container>

                <ng-container matColumnDef="room">
                    <th mat-header-cell *matHeaderCellDef>Room</th>
                    <td mat-cell *matCellDef="let element">{{ element.room }}</td>
                </ng-container>

                <ng-container matColumnDef="lecture">
                    <th mat-header-cell *matHeaderCellDef>Lecture</th>
                    <td mat-cell *matCellDef="let element">{{ element.lecture }}</td>
                </ng-container>

                <ng-container matColumnDef="dateOfReport">
                    <th mat-header-cell *matHeaderCellDef>Date Of Report</th>
                    <td mat-cell *matCellDef="let element">{{ element.dateOfReport }}</td>
                </ng-container>

                <ng-container matColumnDef="time">
                    <th mat-header-cell *matHeaderCellDef>Time</th>
                    <td mat-cell *matCellDef="let element">{{ element.time }}</td>
                </ng-container>

                <ng-container matColumnDef="groupOfStudent">
                    <th mat-header-cell *matHeaderCellDef>Group Of Student</th>
                    <td mat-cell *matCellDef="let element">{{ element.groupOfStudent }}</td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
            </table>
            <mat-paginator
                    [pageSizeOptions]="[10, 20, 50, 100]"
                    showFirstLastButtons
                    aria-label="Select page of periodic elements"
            >
            </mat-paginator>
        </div>
    </mat-drawer-content>
</mat-drawer-container>
